<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Contas a vencer</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#000;--mut:#6b7280;--line:#e5e7eb;--blue:#007AFF;--red:#DC2626;--org:#EA580C;--grn:#16A34A;--fld:#f3f4f6;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#fff;--mut:#9ca3af;--line:#2c2c2e;--red:#f87171;--org:#fb923c;--grn:#22c55e;--fld:#3a3a3c}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
.hide{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0;width:100%}
.red{color:var(--red)}.org{color:var(--org)}.grn{color:var(--grn)}.mut{color:var(--mut)}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ic{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:28rem;margin:0 auto;padding:24px}
#login img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#login h1{font-size:24px;text-align:center}
#sub{font-size:14px;color:var(--mut);text-align:center;margin:4px 0 28px}
.in{padding:14px 16px}.in+.in{border-top:1px solid var(--line)}
.btn{width:100%;background:var(--blue);color:#fff;font-weight:600;padding:14px;border-radius:16px;margin-top:16px}
.btn:disabled{opacity:.6}
.lnk{color:var(--blue);font-size:14px;font-weight:600;padding:8px;display:block;margin:6px auto 0}
#err{color:var(--red);font-size:14px;font-weight:500;text-align:center;margin-top:12px}
.hd{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
.hd-in,.main{max-width:32rem;margin:0 auto}
.hd .out{color:var(--blue);font-size:15px;height:28px}
#greet{font-size:13px;font-weight:500;color:var(--mut)}
#title{font-size:30px;font-weight:700;line-height:1.15}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line);padding:4px;border-radius:12px;margin-top:10px}
.tab{padding:4px;font-size:14px;font-weight:600;border-radius:8px;color:var(--mut)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.main{padding:14px 16px 120px;display:flex;flex-direction:column;gap:14px}
#totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#totals div{background:var(--card);border-radius:16px;padding:10px 14px;font-size:12px;font-weight:500;color:var(--mut)}
#totals b{display:block;font-size:16px;margin-top:2px;color:var(--ink)}
#totals .p b{color:var(--grn)}
.banner{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;font-size:12px;font-weight:600}
.banner .ic{flex:none}
.red-bg{background:rgba(239,68,68,.15);color:var(--red)}.org-bg{background:rgba(249,115,22,.15);color:var(--org)}
#empty{text-align:center;padding:64px 0;color:var(--mut)}
#list{display:flex;flex-direction:column;gap:16px}
#list h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 4px 4px}
.row-w{position:relative;overflow:hidden;background:#ef4444}
.row-w+.row-w{border-top:1px solid var(--line)}
.trash{position:absolute;top:0;bottom:0;right:0;width:76px;background:#ef4444;color:#fff;display:flex;align-items:center;justify-content:center}
.trash .ic{width:20px;height:20px}
.sw{position:relative;background:var(--card);display:flex;align-items:center;gap:6px;padding:10px 14px;transition:transform .25s cubic-bezier(.25,1,.5,1)}
.info{flex:1;min-width:0}
.nm{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paid .nm{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:12px;line-height:1.2;margin-top:3px}
.meta span{white-space:nowrap}
.rec{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:rgba(0,122,255,.12);color:var(--blue)}
.acts{display:flex;align-items:center;flex:none}
.ib{padding:6px;color:var(--mut)}
.pay{font-size:13px;font-weight:700;min-width:82px;padding:4px 10px;margin-left:2px;border-radius:999px;border:2px solid var(--ink)}
.pay.on{background:var(--grn);border-color:var(--grn);color:#fff}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding-bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:none}
.fab button{pointer-events:auto;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,122,255,.3)}
.fab .ic{width:28px;height:28px;stroke-width:2.5}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .3s}
#backdrop.on{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
#sheet.open{transform:none}
.sh-in{max-width:32rem;margin:0 auto}
.sh-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-hd h2{font-size:16px}
.sh-hd button{color:var(--blue)}
.sh-hd #m-save{font-weight:600}.sh-hd #m-save:disabled{opacity:.3}
.sh-bd{padding:16px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.f+.f{border-top:1px solid var(--line)}
.f .fi{background:var(--fld);padding:6px 12px;border-radius:8px;text-align:right;width:auto}
.f small{display:block;font-size:12px;color:var(--mut)}
input[type=checkbox].tg{appearance:none;-webkit-appearance:none;width:44px;height:26px;flex:none;border-radius:13px;background:#9ca3af;position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg:checked{background:#34C759}.tg:checked::after{transform:translateX(18px)}
.wide{width:100%;background:var(--card);padding:12px;border-radius:12px;font-weight:600;color:var(--blue)}
.wide.d{color:var(--red);font-weight:500}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:16px;right:16px;z-index:70;background:var(--blue);color:#fff;font-size:13px;font-weight:600;text-align:center;padding:10px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:#DC2626}
</style>
</head>
<body>

<div id="toast" class="hide" role="status"></div>

<!-- LOGIN -->
<div id="login" class="hide">
  <img src="icon.png" alt="">
  <h1>Contas a vencer</h1>
  <p id="sub">Faça login para acessar suas contas</p>
  <form id="form" onsubmit="submitAuth(event)">
    <div class="card">
      <div class="in hide" id="name-row"><input id="name" placeholder="Seu nome" autocomplete="name"></div>
      <div class="in"><input id="email" type="email" required placeholder="E-mail" autocomplete="email"></div>
      <div class="in"><input id="pass" type="password" required placeholder="Senha" autocomplete="current-password"></div>
    </div>
    <p id="err" class="hide"></p>
    <button id="go" class="btn" type="submit">Entrar</button>
    <button id="toggle" class="lnk" type="button" onclick="setMode(mode=='login'?'signup':'login')">Primeiro acesso? Criar conta</button>
    <button id="forgot" class="lnk mut" type="button" onclick="forgot()">Esqueci minha senha</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header class="hd"><div class="hd-in">
    <button class="out" onclick="logout()">Sair</button>
    <p id="greet">Olá.</p>
    <h1 id="title">Contas a vencer</h1>
    <div class="tabs">
      <button id="tab-h" class="tab" onclick="switchPage('history')">Histórico</button>
      <button id="tab-c" class="tab on" onclick="switchPage('current')">Mês atual</button>
    </div>
  </div></header>

  <main class="main">
    <div id="totals" class="hide">
      <div>Em aberto<b id="t-open">R$ 0,00</b></div>
      <div class="p">Pagas<b id="t-paid">R$ 0,00</b></div>
    </div>
    <div id="banner" class="banner hide">
      <svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="ban-t"></span>
    </div>
    <div id="empty" class="hide"><p id="empty-t"></p></div>
    <div id="list"></div>
  </main>

  <div class="fab"><button onclick="openModal()" aria-label="Nova conta"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>

<!-- FOLHA DE CADASTRO / EDIÇÃO -->
<div id="backdrop" class="hide" onclick="closeModal()"></div>
<div id="sheet" class="hide"><div class="sh-in">
  <div class="sh-hd">
    <button onclick="closeModal()">Cancelar</button>
    <h2 id="m-title">Nova conta</h2>
    <button id="m-save" onclick="save()" disabled>Salvar</button>
  </div>
  <div class="sh-bd">
    <div class="card">
      <div class="f"><input id="b-name" placeholder="Nome da conta (ex: Luz, Internet)" oninput="validate()"></div>
      <div class="f"><label for="b-amount">Valor (opcional)</label><input id="b-amount" class="fi" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" style="width:8rem"></div>
      <div class="f"><label for="b-date">Vencimento</label><input id="b-date" class="fi" type="date" onchange="validate()"></div>
      <label class="f" for="b-rec"><div>Repetir mensalmente<small>Cria a conta do próximo mês ao marcar como paga</small></div><input id="b-rec" class="tg" type="checkbox"></label>
    </div>
    <button id="m-cal" class="wide hide" onclick="calFromForm()">Adicionar vencimento ao Calendário</button>
    <button id="m-del" class="wide d hide" onclick="del(editingId);closeModal()">Excluir conta</button>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" crossorigin="anonymous"></script>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyCXsXTkTOtkXHyge75SDkgfJ2VsPzAizH8",authDomain:"icontas-53234.firebaseapp.com",projectId:"icontas-53234",storageBucket:"icontas-53234.firebasestorage.app",messagingSenderId:"88307899128",appId:"1:88307899128:web:3b136e2ac877540580790d"};
const $=id=>document.getElementById(id);
let auth,db,user=null,bills=[],editingId=null,unsub=null,page='current',mode='login';

/* ---------- utilidades ---------- */
const BRL=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const daysLeft=s=>Math.round((parse(s)-new Date(new Date().setHours(0,0,0,0)))/864e5);
const mkey=s=>s.slice(0,7);
const offKey=o=>{const n=new Date();return iso(new Date(n.getFullYear(),n.getMonth()+o,1)).slice(0,7)};
const monthLabel=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const shortDate=s=>parse(s).toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
function addMonth(s,day){const[y,m]=s.split('-').map(Number);const last=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(day,last)))}
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='hide',4000)}
async function run(fn){try{await fn()}catch(e){toast(e&&e.code=='permission-denied'?'Sem permissão para salvar.':'Não foi possível concluir. Verifique a conexão e tente de novo.',1)}}

/* ---------- login ---------- */
function setMode(m){mode=m;const s=m=='signup';
  $('sub').textContent=s?'Crie sua conta para organizar suas contas':'Faça login para acessar suas contas';
  $('name-row').classList.toggle('hide',!s);$('forgot').classList.toggle('hide',s);
  $('pass').autocomplete=s?'new-password':'current-password';
  $('pass').placeholder=s?'Crie uma senha (mín. 6 caracteres)':'Senha';
  $('go').textContent=s?'Criar conta':'Entrar';
  $('toggle').textContent=s?'Já tenho conta. Fazer login':'Primeiro acesso? Criar conta';
  $('err').classList.add('hide')}
function authMsg(c){c=String(c||'');
  if(/email-already/.test(c))return'Este e-mail já possui cadastro. Toque em "Já tenho conta".';
  if(/weak-password/.test(c))return'A senha precisa ter pelo menos 6 caracteres.';
  if(/invalid-email/.test(c))return'Digite um e-mail válido.';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return'E-mail ou senha incorretos.';
  if(/too-many/.test(c))return'Muitas tentativas. Aguarde um pouco e tente de novo.';
  if(/network/.test(c))return'Sem conexão com a internet.';
  if(/referer|api-key|key-not-valid/.test(c))return'Este site está bloqueado pela chave de API. Confira as restrições da chave no Google Cloud ('+c+').';
  if(/operation-not-allowed/.test(c))return'Login por e-mail/senha não está ativado no Firebase ('+c+').';
  if(/unauthorized-domain/.test(c))return'Este domínio não está autorizado no Firebase ('+c+').';
  return'Não foi possível concluir ('+(c||'erro')+'). Tente novamente.'}
async function submitAuth(e){e.preventDefault();
  const em=$('email').value.trim(),pw=$('pass').value,nm=$('name').value.trim(),err=$('err');
  err.classList.add('hide');$('go').disabled=true;
  try{
    if(mode=='signup'){
      const c=await auth.createUserWithEmailAndPassword(em,pw);
      if(nm){await c.user.updateProfile({displayName:nm});greet(auth.currentUser)}
    }else await auth.signInWithEmailAndPassword(em,pw);
  }catch(x){err.textContent=authMsg(x.code);err.classList.remove('hide')}
  $('go').disabled=false}
async function forgot(){const em=$('email').value.trim();
  if(!em){$('err').textContent='Digite seu e-mail acima e toque em "Esqueci minha senha".';$('err').classList.remove('hide');return}
  try{await auth.sendPasswordResetEmail(em);$('err').classList.add('hide');toast('Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha.')}
  catch(x){$('err').textContent=authMsg(x.code);$('err').classList.remove('hide')}}
function logout(){if(auth)auth.signOut()}
function greet(u){let n=(u.displayName||'').trim();
  if(!n&&u.email){n=u.email.split('@')[0].replace(/[._-]+/g,' ').trim();n=n.charAt(0).toUpperCase()+n.slice(1)}
  $('greet').textContent='Olá '+(n||'Usuário')+'.'}
const col=()=>user&&db.collection('users').doc(user.uid).collection('bills');
function onUser(u){user=u;if(unsub){unsub();unsub=null}
  if(u){greet(u);$('login').classList.add('hide');$('app').classList.remove('hide');
    unsub=col().onSnapshot(s=>{bills=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>toast('Erro ao carregar suas contas.',1))
  }else{bills=[];$('app').classList.add('hide');$('login').classList.remove('hide');render()}}

/* ---------- calendário ---------- */
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function calendar(b){
  if(!b||!b.name||!b.dueDate)return;
  const st=b.dueDate.replace(/-/g,''),nx=parse(b.dueDate);nx.setDate(nx.getDate()+1);
  const en=iso(nx).replace(/-/g,''),desc=Number(b.amount)>0?`Valor: ${BRL(b.amount)}`:'Lembrete de vencimento de conta';
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Contas a vencer//PT','BEGIN:VEVENT',`UID:${b.id||Date.now()}-${st}@contas`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,`DTSTART;VALUE=DATE:${st}`,`DTEND;VALUE=DATE:${en}`,
      `SUMMARY:${icsEsc('Vencimento: '+b.name)}`,`DESCRIPTION:${icsEsc(desc)}`,'BEGIN:VALARM','ACTION:DISPLAY',
      `DESCRIPTION:${icsEsc('Vencimento hoje: '+b.name)}`,'TRIGGER:PT9H','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'})),a=document.createElement('a');
    a.href=url;a.download='vencimento.ics';a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1000);
  }else{
    const p=new URLSearchParams({action:'TEMPLATE',text:'Vencimento: '+b.name,dates:`${st}/${en}`,details:desc});
    window.open('https://calendar.google.com/calendar/render?'+p,'_blank','noopener,noreferrer')}
  toast(`Evento de "${b.name}" enviado para o Calendário.`)}
function calFromForm(){const name=$('b-name').value.trim(),dueDate=$('b-date').value,r=$('b-amount').value;
  if(name&&dueDate)calendar({id:editingId,name,amount:r!==''?Number(r):null,dueDate})}

/* ---------- ações ---------- */
function togglePaid(id){run(async()=>{
  const b=bills.find(x=>x.id==id);if(!b)return;const c=col();
  if(!b.isPaid&&b.isRecurring&&!b.nextGenerated&&!bills.some(x=>x.id==id+'_n')){
    const day=b.recurDay||parse(b.dueDate).getDate();let next=addMonth(b.dueDate,day);
    while(mkey(next)<offKey(0))next=addMonth(next,day);
    const batch=db.batch();
    batch.update(c.doc(id),{isPaid:true,nextGenerated:true});
    batch.set(c.doc(id+'_n'),{name:b.name,amount:b.amount??null,dueDate:next,isPaid:false,isRecurring:true,recurDay:day,nextGenerated:false});
    await batch.commit();toast(`Próxima "${b.name}" criada para ${shortDate(next)}.`);
  }else await c.doc(id).update({isPaid:!b.isPaid})})}
function del(id){if(id&&confirm('Excluir esta conta?'))run(()=>col().doc(id).delete())}
function validate(){$('m-save').disabled=!($('b-name').value.trim()&&$('b-date').value)}
function openModal(id){closeSwipes();clearTimeout(closeModal.t);editingId=id||null;
  const b=id?bills.find(x=>x.id==id):null;
  $('m-title').textContent=b?'Editar conta':'Nova conta';
  $('b-name').value=b?b.name:'';$('b-amount').value=b&&b.amount!=null?b.amount:'';
  if(b)$('b-date').value=b.dueDate;else{const d=new Date();d.setDate(d.getDate()+3);$('b-date').value=iso(d)}
  $('b-rec').checked=!!(b&&b.isRecurring);
  $('m-cal').classList.toggle('hide',!b);$('m-del').classList.toggle('hide',!b);validate();
  $('backdrop').classList.remove('hide');$('sheet').classList.remove('hide');void $('sheet').offsetWidth;
  $('backdrop').classList.add('on');$('sheet').classList.add('open');
  setTimeout(()=>$('b-name').focus(),150)}
function closeModal(){$('backdrop').classList.remove('on');$('sheet').classList.remove('open');
  closeModal.t=setTimeout(()=>{$('backdrop').classList.add('hide');$('sheet').classList.add('hide')},300)}
function save(){
  const name=$('b-name').value.trim(),dueDate=$('b-date').value,raw=$('b-amount').value;
  if(!name||!dueDate)return;
  const data={name,amount:raw!==''?Number(raw):null,dueDate,isRecurring:$('b-rec').checked,recurDay:parse(dueDate).getDate()};
  const id=editingId;closeModal();
  run(async()=>{if(id)await col().doc(id).update(data);else await col().add({...data,isPaid:false,nextGenerated:false})})}

/* ---------- arrastar para excluir ---------- */
function closeSwipes(except){document.querySelectorAll('.sw').forEach(e=>{if(e!==except){e.style.transform='';e.dataset.open=''}})}
function swipe(el){const W=76;let sx=0,sy=0,cx=0,on=false;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;on=false},{passive:true});
  el.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!on){if(Math.abs(dy)>Math.abs(dx)||Math.abs(dx)<6)return;on=true;closeSwipes(el);el.style.transition='none'}
    cx=Math.max(-W-15,Math.min(0,(el.dataset.open?-W:0)+dx));el.style.transform=`translateX(${cx}px)`},{passive:true});
  const end=()=>{el.style.transition='';if(!on)return;on=false;const o=cx<-38;
    el.style.transform=o?`translateX(-${W}px)`:'';el.dataset.open=o?'1':''};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end)}

/* ---------- tela ---------- */
const IC={
  trash:'<svg class="ic" viewBox="0 0 24 24"><path d="M19 7l-.9 12.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"/></svg>',
  cal:'<svg class="ic" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>',
  edit:'<svg class="ic" viewBox="0 0 24 24"><path d="M15.2 5.2l3.6 3.6m-2-5a2.5 2.5 0 1 1 3.5 3.5L6.5 21H3v-3.6L16.7 3.7z"/></svg>'};
function status(b){if(b.isPaid)return['Paga','grn'];const n=daysLeft(b.dueDate);
  return[n<-1?`Venceu há ${-n} dias`:n==-1?'Venceu há 1 dia':n==0?'Vence hoje':n==1?'Vence amanhã':`Vence em ${n} dias`,n<0?'red':n<=3?'org':'mut']}
function row(b){const[st,cl]=status(b),w=document.createElement('div');w.className='row-w';
  w.innerHTML=`<button class="trash" data-act="del" data-id="${b.id}" aria-label="Excluir">${IC.trash}</button>
  <div class="sw ${b.isPaid?'paid':''}"><div class="info"><div class="nm">${esc(b.name)}</div>
  <div class="meta"><span class="${cl}" style="font-weight:700">${st}</span><span class="mut">• ${shortDate(b.dueDate)}</span>
  ${Number(b.amount)>0?`<span style="font-weight:600">• ${BRL(b.amount)}</span>`:''}${b.isRecurring?'<span class="rec">↻ Mensal</span>':''}</div></div>
  <div class="acts"><button class="ib" data-act="cal" data-id="${b.id}" aria-label="Adicionar ao calendário">${IC.cal}</button>
  <button class="ib" data-act="edit" data-id="${b.id}" aria-label="Editar">${IC.edit}</button>
  <button class="pay ${b.isPaid?'on':''}" data-act="pay" data-id="${b.id}">${b.isPaid?'✓ Paga':'Não paga'}</button></div></div>`;
  swipe(w.querySelector('.sw'));return w}
function section(title,items,cls){if(!items.length)return;
  const s=document.createElement('section'),c=document.createElement('div');
  s.innerHTML=`<h2 class="${cls}">${esc(title)} (${items.length})</h2>`;c.className='card';
  items.forEach(b=>c.appendChild(row(b)));s.appendChild(c);$('list').appendChild(s)}
function switchPage(p){page=p;$('tab-c').className='tab'+(p=='current'?' on':'');$('tab-h').className='tab'+(p=='history'?' on':'');
  $('title').textContent=p=='current'?'Contas a vencer':'Histórico';render()}
$('list').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const{act,id}=t.dataset;
  if(act=='del')del(id);else if(act=='cal')calendar(bills.find(b=>b.id==id));else if(act=='edit')openModal(id);else if(act=='pay')togglePaid(id)});
function render(){
  const cur=offKey(0),hist=[offKey(-1),offKey(-2)],by=(a,b)=>parse(a.dueDate)-parse(b.dueDate),ban=$('banner');
  const ok=bills.filter(b=>b.dueDate);
  const curB=ok.filter(b=>mkey(b.dueDate)==cur||(mkey(b.dueDate)<cur&&!b.isPaid));
  const hisB=ok.filter(b=>hist.includes(mkey(b.dueDate)));
  const act=page=='current'?curB:hisB,has=act.some(b=>Number(b.amount)>0);
  $('totals').classList.toggle('hide',!has);
  if(has){const sum=f=>act.filter(f).reduce((a,b)=>a+(Number(b.amount)||0),0);
    $('t-open').textContent=BRL(sum(b=>!b.isPaid));$('t-paid').textContent=BRL(sum(b=>b.isPaid))}
  ban.className='banner hide';$('list').innerHTML='';
  if(page=='current'){
    const open=curB.filter(b=>!b.isPaid).sort(by),paid=curB.filter(b=>b.isPaid).sort(by);
    const late=open.filter(b=>daysLeft(b.dueDate)<0),soon=open.filter(b=>{const d=daysLeft(b.dueDate);return d>=0&&d<=3}),up=open.filter(b=>daysLeft(b.dueDate)>3);
    if(late.length){ban.className='banner red-bg';$('ban-t').textContent=late.length==1?`1 conta atrasada: ${late[0].name}`:`${late.length} contas atrasadas`}
    else if(soon.length){ban.className='banner org-bg';$('ban-t').textContent=soon.length==1?`1 conta vence em breve: ${soon[0].name}`:`${soon.length} contas vencem em breve`}
    $('empty-t').innerHTML='Nenhuma conta neste mês.<br>Toque em <b>+</b> para começar.';
    $('empty').classList.toggle('hide',curB.length>0);
    section('Atrasadas',late,'red');section('Vencem em breve',soon,'org');section('Próximas',up,'mut');section('Pagas',paid,'grn');
  }else{
    $('empty-t').textContent='Nenhuma conta no histórico dos últimos 2 meses.';
    $('empty').classList.toggle('hide',hisB.length>0);
    hist.forEach(k=>section(monthLabel(k),hisB.filter(b=>mkey(b.dueDate)==k).sort(by),'mut'))}}

/* ---------- início ---------- */
try{
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(onUser);
}catch(e){$('login').classList.remove('hide');toast('Não foi possível iniciar. Verifique a conexão com a internet.',1)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
