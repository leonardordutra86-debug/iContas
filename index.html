<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configurações PWA para iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Contas">
    
    <link rel="apple-touch-icon" id="app-icon" href="">
    <title>Contas a vencer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overscroll-behavior-x: none;
        }
        .sheet-enter { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
        .sheet-open { transform: translateY(0); }
        .swipe-content { transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
        .swipe-dragging { transition: none !important; }
    </style>
</head>
<body class="bg-[#F2F2F7] dark:bg-black text-black dark:text-white min-h-screen select-none overflow-x-hidden">

    <!-- ================= TELA 0: CARREGANDO ================= -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-[#F2F2F7] dark:bg-black flex items-center justify-center">
        <div class="text-gray-400 text-sm font-medium animate-pulse">Verificando acesso...</div>
    </div>

    <!-- ================= TELA 1: LOGIN ================= -->
    <div id="login-screen" class="hidden min-h-screen flex flex-col justify-center px-6 max-w-md mx-auto">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#007AFF] text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md text-3xl font-bold">
                ✓
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Contas a vencer</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Faça login para acessar suas contas</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm">
                <div class="px-4 py-3.5">
                    <input type="email" id="login-email" required placeholder="E-mail" autocomplete="email"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
                <div class="px-4 py-3.5">
                    <input type="password" id="login-password" required placeholder="Senha" autocomplete="current-password"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
            </div>

            <p id="login-error" class="hidden text-red-500 text-sm text-center font-medium"></p>

            <button type="submit" id="login-btn" class="w-full bg-[#007AFF] active:opacity-80 text-white font-semibold py-3.5 rounded-2xl shadow-sm transition">
                Entrar
            </button>
        </form>
    </div>

    <!-- ================= TELA 2: APP DE CONTAS ================= -->
    <div id="app-screen" class="hidden">
        <!-- Cabeçalho -->
        <header class="sticky top-0 z-10 bg-[#F2F2F7]/85 dark:bg-black/85 backdrop-blur-md px-4 pt-3 pb-2 border-b border-gray-200/60 dark:border-gray-800/60">
            <div class="flex justify-between items-center h-8">
                <button onclick="handleLogout()" class="text-[#007AFF] text-[16px] active:opacity-50">
                    Sair
                </button>
                <button onclick="openModal()" aria-label="Nova conta" class="text-[#007AFF] active:opacity-50 p-1">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                </button>
            </div>
            <h1 class="text-[34px] font-bold tracking-tight leading-tight">Contas a vencer</h1>
        </header>

        <!-- Conteúdo Principal -->
        <main class="px-4 py-4 max-w-lg mx-auto space-y-4 pb-24">
            <!-- Banner de Aviso -->
            <div id="alert-banner" class="hidden rounded-xl p-3.5 flex items-center gap-3 font-semibold text-sm shadow-sm">
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                </svg>
                <span id="alert-text"></span>
            </div>

            <!-- Estado Vazio -->
            <div id="empty-state" class="hidden text-center py-16 text-gray-500 dark:text-gray-400">
                <p class="text-base">Nenhuma conta ainda.<br>Toque em <strong>+</strong> para começar.</p>
            </div>

            <!-- Lista de Contas -->
            <div id="bills-list" class="hidden bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm"></div>
        </main>
    </div>

    <!-- Modal / Sheet -->
    <div id="modal-backdrop" onclick="closeModal()" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="bill-sheet" class="fixed inset-x-0 bottom-0 z-50 bg-[#F2F2F7] dark:bg-[#1C1C1E] rounded-t-2xl shadow-2xl sheet-enter hidden pb-8">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-200 dark:border-gray-800">
            <button onclick="closeModal()" class="text-[#007AFF] text-base active:opacity-50">Cancelar</button>
            <h2 id="modal-title" class="font-semibold text-base">Nova conta</h2>
            <button id="save-btn" onclick="saveBill()" class="text-[#007AFF] font-semibold text-base disabled:opacity-30 active:opacity-50" disabled>Salvar</button>
        </div>

        <div class="p-4 space-y-4">
            <div class="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-700">
                <div class="px-4 py-3">
                    <input type="text" id="bill-name" placeholder="Nome da conta (ex: Luz, Internet)" oninput="validateForm()"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
                <div class="px-4 py-3 flex items-center justify-between">
                    <label for="bill-date" class="text-base">Vencimento</label>
                    <input type="date" id="bill-date" onchange="validateForm()"
                        class="bg-gray-100 dark:bg-[#3A3A3C] px-3 py-1.5 rounded-lg text-base outline-none text-right">
                </div>
            </div>

            <button id="delete-btn" onclick="deleteCurrentBill()" class="hidden w-full bg-white dark:bg-[#2C2C2E] text-red-500 font-medium py-3 rounded-xl active:bg-gray-100">
                Excluir conta
            </button>
        </div>
    </div>

    <!-- Firebase SDK (Auth + Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 COLE SUAS CREDENCIAIS DO FIREBASE ABAIXO:
        const firebaseConfig = {
            apiKey: "AIzaSyCXsXTkTOtkXHyge75SDkgfJ2VsPzAizH8",
            authDomain: "icontas-53234.firebaseapp.com",
            projectId: "icontas-53234",
            storageBucket: "Sicontas-53234.firebasestorage.app",
            messagingSenderId: "88307899128",
            appId: "1:88307899128:web:3b136e2ac877540580790d"
            measurementId: "G-M6J7ND5ZCL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let bills = [];
        let editingId = null;
        let unsubscribeBills = null;

        // Gerar ícone automático do app
        const canvas = document.createElement('canvas');
        canvas.width = 180; canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#007AFF'; ctx.fillRect(0, 0, 180, 180);
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 90px -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✓', 90, 95);
        document.getElementById('app-icon').href = canvas.toDataURL('image/png');

        // Monitora estado do Login
        onAuthStateChanged(auth, (user) => {
            document.getElementById('splash-screen').classList.add('hidden');
            
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                startListeningBills();
            } else {
                if (unsubscribeBills) { unsubscribeBills(); unsubscribeBills = null; }
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
           } catch (err) {
                errorEl.textContent = 'E-mail ou senha incorretos.';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
        }

        function startListeningBills() {
            if (unsubscribeBills) return;
            unsubscribeBills = onSnapshot(collection(db, "bills"), (snapshot) => {
                bills = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });
        }

        // Funções de Ação das Contas
        window.togglePaid = async function(id) {
            const bill = bills.find(b => b.id === id);
            if (bill) {
                await updateDoc(doc(db, "bills", id), { isPaid: !bill.isPaid });
            }
        }

        window.deleteBillById = async function(id) {
            await deleteDoc(doc(db, "bills", id));
        }

        window.openModal = function(id = null) {
            closeAllSwipes();
            editingId = id;
            const modalTitle = document.getElementById('modal-title');
            const nameInput = document.getElementById('bill-name');
            const dateInput = document.getElementById('bill-date');
            const deleteBtn = document.getElementById('delete-btn');

            if (id) {
                const bill = bills.find(b => b.id === id);
                modalTitle.textContent = 'Editar conta';
                nameInput.value = bill.name;
                dateInput.value = bill.dueDate;
                deleteBtn.classList.remove('hidden');
            } else {
                modalTitle.textContent = 'Nova conta';
                nameInput.value = '';
                const defaultDate = new Date();
                defaultDate.setDate(defaultDate.getDate() + 3);
                dateInput.value = defaultDate.toISOString().split('T')[0];
                deleteBtn.classList.add('hidden');
            }

            validateForm();
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('bill-sheet');
            backdrop.classList.remove('hidden');
            sheet.classList.remove('hidden');
            requestAnimationFrame(() => {
                backdrop.classList.remove('opacity-0');
                sheet.classList.add('sheet-open');
            });
            setTimeout(() => nameInput.focus(), 100);
        }

        window.closeModal = function() {
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('bill-sheet');
            backdrop.classList.add('opacity-0');
            sheet.classList.remove('sheet-open');
            setTimeout(() => { backdrop.classList.add('hidden'); sheet.classList.add('hidden'); }, 300);
        }

        window.validateForm = function() {
            const name = document.getElementById('bill-name').value.trim();
            const date = document.getElementById('bill-date').value;
            document.getElementById('save-btn').disabled = !(name.length > 0 && date);
        }

        window.saveBill = async function() {
            const name = document.getElementById('bill-name').value.trim();
            const dueDate = document.getElementById('bill-date').value;
            if (!name || !dueDate) return;

            if (editingId) {
                await updateDoc(doc(db, "bills", editingId), { name, dueDate });
            } else {
                await addDoc(collection(db, "bills"), { name, dueDate, isPaid: false });
            }
            closeModal();
        }

        window.deleteCurrentBill = async function() {
            if (!editingId) return;
            await deleteDoc(doc(db, "bills", editingId));
            closeModal();
        }

        // Helpers de Data
        function getStartOfDay(dateObj) {
            return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        }

        function parseLocalDate(isoDateStr) {
            const [y, m, d] = isoDateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function getDaysLeft(dueDateStr) {
            const hoje = getStartOfDay(new Date());
            const venc = parseLocalDate(dueDateStr);
            return Math.round((venc - hoje) / (1000 * 60 * 60 * 24));
        }

        function getStatusInfo(bill) {
            if (bill.isPaid) return { text: 'Paga', colorClass: 'text-green-600 dark:text-green-500' };
            const n = getDaysLeft(bill.dueDate);
            let text = n < -1 ? `Venceu há ${-n} dias` : n === -1 ? 'Venceu há 1 dia' : n === 0 ? 'Vence hoje' : n === 1 ? 'Vence amanhã' : `Vence em ${n} dias`;
            let colorClass = n < 0 ? 'text-red-600 dark:text-red-500' : n <= 3 ? 'text-orange-500 dark:text-orange-400' : 'text-gray-500 dark:text-gray-400';
            return { text, colorClass };
        }

        function formatShortDate(dueDateStr) {
            return parseLocalDate(dueDateStr).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '');
        }

        // Lógica de Arrastar para Esquerda (Swipe to Delete estilo iOS)
        function closeAllSwipes(exceptEl = null) {
            document.querySelectorAll('.swipe-content').forEach(el => {
                if (el !== exceptEl) {
                    el.style.transform = 'translateX(0px)';
                    el.dataset.open = 'false';
                }
            });
        }

        function attachSwipeGesture(container, contentEl) {
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let isSwiping = false;
            const actionWidth = 76; // Largura do botão vermelho da lixeira

            contentEl.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isSwiping = false;
                contentEl.classList.add('swipe-dragging');
            }, { passive: true });

            contentEl.addEventListener('touchmove', (e) => {
                const diffX = e.touches[0].clientX - startX;
                const diffY = e.touches[0].clientY - startY;

                // Ignora se o movimento for mais vertical (rolagem da lista)
                if (!isSwiping && Math.abs(diffY) > Math.abs(diffX)) return;
                
                isSwiping = true;
                closeAllSwipes(contentEl);

                const isOpen = contentEl.dataset.open === 'true';
                let translate = isOpen ? -actionWidth + diffX : diffX;

                // Limita o arraste apenas para a esquerda (valores negativos)
                if (translate > 0) translate = 0;
                if (translate < -actionWidth - 15) translate = -actionWidth - 15;

                currentX = translate;
                contentEl.style.transform = `translateX(${translate}px)`;
            }, { passive: true });

            contentEl.addEventListener('touchend', () => {
                contentEl.classList.remove('swipe-dragging');
                if (!isSwiping) return;

                if (currentX < -38) {
                    contentEl.style.transform = `translateX(-${actionWidth}px)`;
                    contentEl.dataset.open = 'true';
                } else {
                    contentEl.style.transform = 'translateX(0px)';
                    contentEl.dataset.open = 'false';
                }
            });
        }

        // Renderização da Lista
        function render() {
            const listEl = document.getElementById('bills-list');
            const emptyEl = document.getElementById('empty-state');
            const bannerEl = document.getElementById('alert-banner');
            const bannerTextEl = document.getElementById('alert-text');

            const sorted = [...bills].sort((a, b) => {
                if (a.isPaid !== b.isPaid) return a.isPaid ? 1 : -1;
                return parseLocalDate(a.dueDate) - parseLocalDate(b.dueDate);
            });

            const open = bills.filter(b => !b.isPaid);
            const late = open.filter(b => getDaysLeft(b.dueDate) < 0);
            const soon = open.filter(b => getDaysLeft(b.dueDate) <= 3);

            bannerEl.className = 'hidden rounded-xl p-3.5 flex items-center gap-3 font-semibold text-sm shadow-sm';
            if (late.length > 0) {
                bannerEl.classList.remove('hidden');
                bannerEl.classList.add('bg-red-500/15', 'text-red-600', 'dark:text-red-400');
                bannerTextEl.textContent = late.length === 1 ? `1 conta atrasada: ${late[0].name}` : `${late.length} contas atrasadas`;
            } else if (soon.length > 0) {
                bannerEl.classList.remove('hidden');
                bannerEl.classList.add('bg-orange-500/15', 'text-orange-600', 'dark:text-orange-400');
                bannerTextEl.textContent = soon.length === 1 ? `1 conta vence em breve: ${soon[0].name}` : `${soon.length} contas vencem em breve`;
            }

            if (sorted.length === 0) {
                listEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.classList.remove('hidden');
            listEl.innerHTML = '';

            sorted.forEach(bill => {
                const status = getStatusInfo(bill);
                
                // Wrapper relativo para o efeito de swipe
                const wrapper = document.createElement('div');
                wrapper.className = 'relative overflow-hidden bg-red-500';

                // Botão vermelho da lixeira no fundo (aparece ao arrastar para esquerda)
                const trashBtn = document.createElement('button');
                trashBtn.className = 'absolute inset-y-0 right-0 w-[76px] bg-red-500 active:bg-red-600 text-white flex items-center justify-center';
                trashBtn.setAttribute('aria-label', 'Excluir');
                trashBtn.onclick = () => deleteBillById(bill.id);
                trashBtn.innerHTML = `
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                `;

                // Camada frontal que desliza
                const contentEl = document.createElement('div');
                contentEl.className = 'swipe-content relative bg-white dark:bg-[#1C1C1E] flex items-center justify-between px-4 py-3.5 gap-2 z-10';
                contentEl.dataset.open = 'false';
                contentEl.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="font-semibold text-[17px] truncate ${bill.isPaid ? 'line-through text-gray-400 dark:text-gray-500' : ''}">
                            ${escapeHTML(bill.name)}
                        </div>
                        <div class="flex items-center gap-1.5 text-[13px] mt-0.5">
                            <span class="font-bold ${status.colorClass}">${status.text}</span>
                            <span class="text-gray-400 dark:text-gray-500">• ${formatShortDate(bill.dueDate)}</span>
                        </div>
                    </div>
                    <button onclick="openModal('${bill.id}')" aria-label="Editar" class="p-2 text-gray-400 hover:text-gray-300 active:opacity-50">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                        </svg>
                    </button>
                    <button onclick="togglePaid('${bill.id}')" 
                        class="text-[14px] font-bold min-w-[88px] py-1.5 px-3 rounded-full border-2 transition-colors active:scale-95
                        ${bill.isPaid ? 'bg-green-600 border-green-600 text-white' : 'border-black dark:border-white text-black dark:text-white'}">
                        ${bill.isPaid ? '✓ Paga' : 'Não paga'}
                    </button>
                `;

                wrapper.appendChild(trashBtn);
                wrapper.appendChild(contentEl);
                attachSwipeGesture(wrapper, contentEl);
                listEl.appendChild(wrapper);
            });
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
