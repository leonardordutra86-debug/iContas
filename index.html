<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configurações PWA para iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Contas">
    
    <link rel="apple-touch-icon" id="app-icon" href="">
    <title>Contas a vencer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overscroll-behavior-x: none;
        }
        .sheet-enter { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
        .sheet-open { transform: translateY(0); }
        .swipe-content { transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
        .swipe-dragging { transition: none !important; }
    </style>
</head>
<body class="bg-[#F2F2F7] dark:bg-black text-black dark:text-white min-h-screen select-none overflow-x-hidden">

    <!-- ================= TELA 1: LOGIN ================= -->
    <div id="login-screen" class="hidden min-h-screen flex flex-col justify-center px-6 max-w-md mx-auto">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#007AFF] text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md text-3xl font-bold">
                ✓
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Contas a vencer</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Faça login para acessar suas contas</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm">
                <div class="px-4 py-3.5">
                    <input type="email" id="login-email" required placeholder="E-mail" autocomplete="email"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
                <div class="px-4 py-3.5">
                    <input type="password" id="login-password" required placeholder="Senha" autocomplete="current-password"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
            </div>

            <p id="login-error" class="hidden text-red-500 text-sm text-center font-medium"></p>

            <button type="submit" id="login-btn" class="w-full bg-[#007AFF] active:opacity-80 text-white font-semibold py-3.5 rounded-2xl shadow-sm transition">
                Entrar
            </button>
        </form>
    </div>

    <!-- ================= TELA 2: APP DE CONTAS ================= -->
    <div id="app-screen" class="hidden">
        <header class="sticky top-0 z-10 bg-[#F2F2F7]/85 dark:bg-black/85 backdrop-blur-md px-4 pt-3 pb-2 border-b border-gray-200/60 dark:border-gray-800/60">
            <div class="flex justify-between items-center h-8">
                <button onclick="handleLogout()" class="text-[#007AFF] text-[16px] active:opacity-50">
                    Sair
                </button>
                <button onclick="openModal()" aria-label="Nova conta" class="text-[#007AFF] active:opacity-50 p-1">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                </button>
            </div>
            <h1 class="text-[34px] font-bold tracking-tight leading-tight">Contas a vencer</h1>
        </header>

        <main class="px-4 py-4 max-w-lg mx-auto space-y-4 pb-24">
            <div id="alert-banner" class="hidden rounded-xl p-3.5 flex items-center gap-3 font-semibold text-sm shadow-sm">
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                </svg>
                <span id="alert-text"></span>
            </div>

            <div id="empty-state" class="hidden text-center py-16 text-gray-500 dark:text-gray-400">
                <p class="text-base">Nenhuma conta ainda.<br>Toque em <strong>+</strong> para começar.</p>
            </div>

            <div id="bills-list" class="hidden bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm"></div>
        </main>
    </div>

    <!-- Modal / Sheet -->
    <div id="modal-backdrop" onclick="closeModal()" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="bill-sheet" class="fixed inset-x-0 bottom-0 z-50 bg-[#F2F2F7] dark:bg-[#1C1C1E] rounded-t-2xl shadow-2xl sheet-enter hidden pb-8">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-200 dark:border-gray-800">
            <button onclick="closeModal()" class="text-[#007AFF] text-base active:opacity-50">Cancelar</button>
            <h2 id="modal-title" class="font-semibold text-base">Nova conta</h2>
            <button id="save-btn" onclick="saveBill()" class="text-[#007AFF] font-semibold text-base disabled:opacity-30 active:opacity-50" disabled>Salvar</button>
        </div>

        <div class="p-4 space-y-4">
            <div class="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-700">
                <div class="px-4 py-3">
                    <input type="text" id="bill-name" placeholder="Nome da conta (ex: Luz, Internet)" oninput="validateForm()"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
                <div class="px-4 py-3 flex items-center justify-between">
                    <label for="bill-date" class="text-base">Vencimento</label>
                    <input type="date" id="bill-date" onchange="validateForm()"
                        class="bg-gray-100 dark:bg-[#3A3A3C] px-3 py-1.5 rounded-lg text-base outline-none text-right">
                </div>
            </div>

            <button id="delete-btn" onclick="deleteCurrentBill()" class="hidden w-full bg-white dark:bg-[#2C2C2E] text-red-500 font-medium py-3 rounded-xl active:bg-gray-100">
                Excluir conta
            </button>
        </div>
    </div>

    <!-- Firebase SDK (Auth + Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 COLE SUAS CREDENCIAIS DO FIREBASE ABAIXO:
        const firebaseConfig = {
            apiKey: "AIzaSyCXsXTkTOtkXHyge75SDkgfJ2VsPzAizH8",
  authDomain: "icontas-53234.firebaseapp.com",
  projectId: "icontas-53234",
  storageBucket: "icontas-53234.firebasestorage.app",
  messagingSenderId: "88307899128",
  appId: "1:88307899128:web:3b136e2ac877540580790d",
  measurementId: "G-M6J7ND5ZCL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Garante persistência local para evitar loop de autenticação
        setPersistence(auth, browserLocalPersistence).catch((err) => console.error(err));

        const db = getFirestore(app);

        let bills = [];
        let editingId = null;
        let unsubscribeBills = null;

        // Gerar ícone automático do app
        const canvas = document.createElement('canvas');
        canvas.width = 180; canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#007AFF'; ctx.fillRect(0, 0, 180, 180);
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 90px -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✓', 90, 95);
        document.getElementById('app-icon').href = canvas.toDataURL('image/png');

        // Monitora estado do Login de forma estável
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                startListeningBills();
            } else {
                if (unsubscribeBills) { unsubscribeBills(); unsubscribeBills = null; }
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error(err);
                errorEl.textContent = 'E-mail ou senha incorretos.';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
        }

        function startListeningBills() {
            if (unsubscribeBills) return;
            unsubscribeBills = onSnapshot(collection(db, "bills"), (snapshot) => {
                bills = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, (error) => {
                console.error("Erro no Firestore:", error);
            });
        }

        window.togglePaid = async function(id) {
            const bill = bills.find(b => b.id === id);
            if (bill) {
                await updateDoc(doc(db, "bills", id), { isPaid: !bill.isPaid });
            }
        }

        window.deleteBillById = async function(id) {
            await deleteDoc(doc(db, "bills", id));
        }

        window.openModal = function(id = null) {
            closeAllSwipes();
            editingId = id;
            const modalTitle = document.getElementById('modal-title');
            const nameInput = document.getElementById('bill-name');
            const dateInput = document.getElementById('bill-date');
            const deleteBtn = document.getElementById('delete-btn');

            if (id) {
