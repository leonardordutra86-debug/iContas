<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Contas">
    
    <link rel="apple-touch-icon" href="icon.png">
    <title>Contas a vencer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overscroll-behavior-x: none;
        }
        .sheet-enter { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
        .sheet-open { transform: translateY(0); }
        .swipe-content { transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
        .swipe-dragging { transition: none !important; }
    </style>
</head>
<body class="bg-[#F2F2F7] dark:bg-black text-black dark:text-white min-h-screen select-none overflow-x-hidden">

    <!-- Aviso de Erro Técnico -->
    <div id="fatal-error" class="hidden fixed top-4 inset-x-4 z-50 bg-red-600 text-white text-xs p-3 rounded-xl shadow-lg break-words"></div>

    <!-- ================= TELA 1: LOGIN ================= -->
    <div id="login-screen" class="min-h-screen flex flex-col justify-center px-6 max-w-md mx-auto">
        <div class="text-center mb-8">
            <img src="icon.png" alt="Ícone do app" class="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-md object-cover">
            <h1 class="text-2xl font-bold tracking-tight">Contas a vencer</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Faça login para acessar suas contas</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm">
                <div class="px-4 py-3.5">
                    <input type="email" id="login-email" required placeholder="E-mail" autocomplete="email"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
                <div class="px-4 py-3.5">
                    <input type="password" id="login-password" required placeholder="Senha" autocomplete="current-password"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
            </div>

            <p id="login-error" class="hidden text-red-500 text-sm text-center font-medium"></p>

            <button type="submit" id="login-btn" class="w-full bg-[#007AFF] active:opacity-80 text-white font-semibold py-3.5 rounded-2xl shadow-sm transition">
                Entrar
            </button>
        </form>
    </div>

    <!-- ================= TELA 2: APP DE CONTAS ================= -->
    <div id="app-screen" class="hidden">
        <header class="sticky top-0 z-10 bg-[#F2F2F7]/85 dark:bg-black/85 backdrop-blur-md px-4 pt-3 pb-2.5 border-b border-gray-200/60 dark:border-gray-800/60">
            <div class="flex justify-between items-center h-8">
                <button type="button" onclick="handleLogout()" class="text-[#007AFF] text-[16px] active:opacity-50">
                    Sair
                </button>
                <button type="button" onclick="openModal()" aria-label="Nova conta" class="text-[#007AFF] active:opacity-50 p-1">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                </button>
            </div>
            <p id="user-greeting" class="text-[14px] font-medium text-gray-500 dark:text-gray-400 mt-1">Olá.</p>
            <h1 id="page-title" class="text-[34px] font-bold tracking-tight leading-tight">Contas a vencer</h1>

            <!-- Seletor de Página: Atual x Histórico (máx. 2 meses) -->
            <div class="mt-3 grid grid-cols-2 bg-gray-200/80 dark:bg-[#1C1C1E] p-1 rounded-xl">
                <button type="button" id="tab-current" onclick="switchPage('current')"
                    class="py-1.5 text-sm font-semibold rounded-lg bg-white dark:bg-[#2C2C2E] text-black dark:text-white shadow-sm transition">
                    Mês atual
                </button>
                <button type="button" id="tab-history" onclick="switchPage('history')"
                    class="py-1.5 text-sm font-semibold rounded-lg text-gray-600 dark:text-gray-400 transition">
                    Histórico (2m)
                </button>
            </div>
        </header>

        <main class="px-4 py-4 max-w-lg mx-auto space-y-5 pb-24">
            <!-- Resumo simples de valores -->
            <div id="totals-card" class="hidden grid grid-cols-2 gap-3">
                <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl p-3.5 shadow-sm">
                    <div id="label-open" class="text-xs font-medium text-gray-500 dark:text-gray-400">Em aberto</div>
                    <div id="total-open" class="text-lg font-bold mt-0.5">R$ 0,00</div>
                </div>
                <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl p-3.5 shadow-sm">
                    <div id="label-paid" class="text-xs font-medium text-gray-500 dark:text-gray-400">Pagas</div>
                    <div id="total-paid" class="text-lg font-bold text-green-600 dark:text-green-500 mt-0.5">R$ 0,00</div>
                </div>
            </div>

            <div id="alert-banner" class="hidden rounded-xl p-3.5 flex items-center gap-3 font-semibold text-sm shadow-sm">
                <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                </svg>
                <span id="alert-text"></span>
            </div>

            <div id="recurring-toast" class="hidden rounded-xl p-3 bg-[#007AFF]/15 text-[#007AFF] text-xs font-semibold text-center"></div>

            <div id="empty-state" class="hidden text-center py-16 text-gray-500 dark:text-gray-400">
                <p id="empty-text" class="text-base">Nenhuma conta ainda.<br>Toque em <strong>+</strong> para começar.</p>
            </div>

            <!-- Contêiner das seções agrupadas -->
            <div id="grouped-bills" class="space-y-5"></div>
        </main>
    </div>

    <!-- Modal / Sheet -->
    <div id="modal-backdrop" onclick="closeModal()" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="bill-sheet" class="fixed inset-x-0 bottom-0 z-50 bg-[#F2F2F7] dark:bg-[#1C1C1E] rounded-t-2xl shadow-2xl sheet-enter hidden pb-8">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-gray-200 dark:border-gray-800">
            <button type="button" onclick="closeModal()" class="text-[#007AFF] text-base active:opacity-50">Cancelar</button>
            <h2 id="modal-title" class="font-semibold text-base">Nova conta</h2>
            <button type="button" id="save-btn" onclick="saveBill()" class="text-[#007AFF] font-semibold text-base disabled:opacity-30 active:opacity-50" disabled>Salvar</button>
        </div>

        <div class="p-4 space-y-4">
            <div class="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-700">
                <div class="px-4 py-3">
                    <input type="text" id="bill-name" placeholder="Nome da conta (ex: Luz, Internet)" oninput="validateForm()"
                        class="w-full bg-transparent text-base outline-none placeholder-gray-400">
                </div>
                <div class="px-4 py-3 flex items-center justify-between">
                    <label for="bill-amount" class="text-base">Valor (opcional)</label>
                    <input type="number" id="bill-amount" step="0.01" min="0" inputmode="decimal" placeholder="0,00"
                        class="w-32 bg-gray-100 dark:bg-[#3A3A3C] px-3 py-1.5 rounded-lg text-base outline-none text-right">
                </div>
                <div class="px-4 py-3 flex items-center justify-between">
                    <label for="bill-date" class="text-base">Vencimento</label>
                    <input type="date" id="bill-date" onchange="validateForm()"
                        class="bg-gray-100 dark:bg-[#3A3A3C] px-3 py-1.5 rounded-lg text-base outline-none text-right">
                </div>
                <label for="bill-recurring" class="px-4 py-3.5 flex items-center justify-between cursor-pointer">
                    <div>
                        <div class="text-base">Repetir mensalmente</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">Aparece na virada do mês e cria próximo mês ao pagar</div>
                    </div>
                    <div class="relative inline-flex items-center">
                        <input type="checkbox" id="bill-recurring" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-300 dark:bg-gray-600 rounded-full peer peer-checked:bg-[#34C759] transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5 shadow-inner"></div>
                    </div>
                </label>
            </div>

            <button type="button" id="delete-btn" onclick="deleteCurrentBill()" class="hidden w-full bg-white dark:bg-[#2C2C2E] text-red-500 font-medium py-3 rounded-xl active:bg-gray-100">
                Excluir conta
            </button>
        </div>
    </div>

    <script>
        window.onerror = function(msg) {
            const box = document.getElementById('fatal-error');
            box.textContent = 'Erro no código: ' + msg;
            box.classList.remove('hidden');
        };
    </script>

    <!-- Firebase SDK Compat (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXsXTkTOtkXHyge75SDkgfJ2VsPzAizH8",
            authDomain: "icontas-53234.firebaseapp.com",
            projectId: "icontas-53234",
            storageBucket: "icontas-53234.firebasestorage.app",
            messagingSenderId: "88307899128",
            appId: "1:88307899128:web:3b136e2ac877540580790d"
        };

        let auth = null;
        let db = null;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (err) {
            const box = document.getElementById('fatal-error');
            box.textContent = 'Erro ao iniciar Firebase: ' + err.message;
            box.classList.remove('hidden');
        }

        let currentUser = null;
        let bills = [];
        let editingId = null;
        let unsubscribeBills = null;
        let currentPage = 'current'; // 'current' | 'history'

        function getUserBillsCollection() {
            if (!db || !currentUser) return null;
            return db.collection("users").doc(currentUser.uid).collection("bills");
        }

        function formatUserName(user) {
            if (user.displayName && user.displayName.trim()) {
                return user.displayName.trim();
            }
            if (user.email) {
                const rawName = user.email.split('@')[0].replace(/[._-]+/g, ' ').trim();
                return rawName.charAt(0).toUpperCase() + rawName.slice(1);
            }
            return 'Usuário';
        }

        function formatBRL(value) {
            const num = Number(value) || 0;
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatICSDate(isoDateStr) {
            return isoDateStr.replace(/-/g, '');
        }

        function getNextDayICS(isoDateStr) {
            const d = parseLocalDate(isoDateStr);
            d.setDate(d.getDate() + 1);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}${m}${day}`;
        }

        function escapeICSText(str) {
            return String(str || '')
                .replace(/\\/g, '\\\\')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,')
                .replace(/\n/g, '\\n');
        }

        function exportBillToCalendar(id) {
            const bill = bills.find(b => b.id === id);
            if (!bill || !bill.dueDate) return;

            const startICS = formatICSDate(bill.dueDate);
            const endICS = getNextDayICS(bill.dueDate);
            const nowStamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

            const amountLine = bill.amount != null && Number(bill.amount) > 0
                ? `Valor: ${formatBRL(bill.amount)}`
                : 'Lembrete de vencimento de conta';

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Contas a vencer//PWA//PT',
                'BEGIN:VEVENT',
                `UID:${bill.id}-${startICS}@contas-pwa`,
                `DTSTAMP:${nowStamp}`,
                `DTSTART;VALUE=DATE:${startICS}`,
                `DTEND;VALUE=DATE:${endICS}`,
                `SUMMARY:${escapeICSText(`Vencimento: ${bill.name}`)}`,
                `DESCRIPTION:${escapeICSText(amountLine)}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safeSlug = bill.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'conta';
            a.href = url;
            a.download = `vencimento-${safeSlug}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            showToast(`Evento de "${bill.name}" preparado para o Calendário.`);
        }

        function switchPage(page) {
            currentPage = page;
            const tabCurrent = document.getElementById('tab-current');
            const tabHistory = document.getElementById('tab-history');
            const pageTitle = document.getElementById('page-title');

            if (page === 'current') {
                tabCurrent.className = 'py-1.5 text-sm font-semibold rounded-lg bg-white dark:bg-[#2C2C2E] text-black dark:text-white shadow-sm transition';
                tabHistory.className = 'py-1.5 text-sm font-semibold rounded-lg text-gray-600 dark:text-gray-400 transition';
                pageTitle.textContent = 'Contas a vencer';
            } else {
                tabHistory.className = 'py-1.5 text-sm font-semibold rounded-lg bg-white dark:bg-[#2C2C2E] text-black dark:text-white shadow-sm transition';
                tabCurrent.className = 'py-1.5 text-sm font-semibold rounded-lg text-gray-600 dark:text-gray-400 transition';
                pageTitle.textContent = 'Histórico';
            }
            render();
        }

        function getMonthKeyFromDateStr(isoDateStr) {
            const [y, m] = isoDateStr.split('-');
            return `${y}-${m}`; // ex: "2026-11"
        }

        function getOffsetMonthKey(monthOffset) {
            const now = new Date();
            const d = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function formatMonthLabel(monthKey) {
            const [y, m] = monthKey.split('-').map(Number);
            const d = new Date(y, m - 1, 1);
            return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        }

        if (auth) {
            auth.onAuthStateChanged((user) => {
                currentUser = user;
                if (user) {
                    document.getElementById('user-greeting').textContent = `Olá ${formatUserName(user)}.`;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    startListeningBills();
                } else {
                    if (unsubscribeBills) { unsubscribeBills(); unsubscribeBills = null; }
                    bills = [];
                    render();
                    document.getElementById('app-screen').classList.add('hidden');
                    document.getElementById('login-screen').classList.remove('hidden');
                }
            });
        }

        async function handleLogin(e) {
            e.preventDefault();
            if (!auth) {
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = 'Firebase não inicializado.';
                errorEl.classList.remove('hidden');
                return;
            }
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
                errorEl.textContent = `Falha no login (${err.code || 'erro'})`;
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        async function handleLogout() {
            if (auth) await auth.signOut();
        }

        function startListeningBills() {
            if (unsubscribeBills) { unsubscribeBills(); unsubscribeBills = null; }
            const colRef = getUserBillsCollection();
            if (!colRef) return;

            unsubscribeBills = colRef.onSnapshot((snapshot) => {
                bills = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, (error) => {
                const box = document.getElementById('fatal-error');
                box.textContent = 'Erro no banco de dados: ' + error.message;
                box.classList.remove('hidden');
            });
        }

        function addOneMonthISO(isoDateStr) {
            const [y, m, d] = isoDateStr.split('-').map(Number);
            const targetMonthIndex = m;
            const daysInTargetMonth = new Date(y, targetMonthIndex + 1, 0).getDate();
            const safeDay = Math.min(d, daysInTargetMonth);
            const nextDate = new Date(y, targetMonthIndex, safeDay);

            const ny = nextDate.getFullYear();
            const nm = String(nextDate.getMonth() + 1).padStart(2, '0');
            const nd = String(nextDate.getDate()).padStart(2, '0');
            return `${ny}-${nm}-${nd}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('recurring-toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        async function togglePaid(id) {
            const colRef = getUserBillsCollection();
            const bill = bills.find(b => b.id === id);
            if (!colRef || !bill) return;

            const markingAsPaid = !bill.isPaid;

            if (markingAsPaid && bill.isRecurring && !bill.nextGenerated) {
                const nextDueDate = addOneMonthISO(bill.dueDate);
                await colRef.doc(id).update({ isPaid: true, nextGenerated: true });
                await colRef.add({
                    name: bill.name,
                    amount: bill.amount ?? null,
                    dueDate: nextDueDate,
                    isPaid: false,
                    isRecurring: true,
                    nextGenerated: false
                });
                showToast(`Próxima "${bill.name}" criada para ${formatShortDate(nextDueDate)}.`);
            } else {
                await colRef.doc(id).update({ isPaid: markingAsPaid });
            }
        }

        async function deleteBillById(id) {
            const colRef = getUserBillsCollection();
            if (!colRef) return;
            await colRef.doc(id).delete();
        }

        function openModal(id = null) {
            closeAllSwipes();
            editingId = id;
            const modalTitle = document.getElementById('modal-title');
            const nameInput = document.getElementById('bill-name');
            const amountInput = document.getElementById('bill-amount');
            const dateInput = document.getElementById('bill-date');
            const recurringInput = document.getElementById('bill-recurring');
            const deleteBtn = document.getElementById('delete-btn');

            if (id) {
                const bill = bills.find(b => b.id === id);
                modalTitle.textContent = 'Editar conta';
                nameInput.value = bill.name;
                amountInput.value = bill.amount != null ? bill.amount : '';
                dateInput.value = bill.dueDate;
                recurringInput.checked = Boolean(bill.isRecurring);
                deleteBtn.classList.remove('hidden');
            } else {
                modalTitle.textContent = 'Nova conta';
                nameInput.value = '';
                amountInput.value = '';
                const defaultDate = new Date();
                defaultDate.setDate(defaultDate.getDate() + 3);
                dateInput.value = defaultDate.toISOString().split('T')[0];
                recurringInput.checked = false;
                deleteBtn.classList.add('hidden');
            }

            validateForm();
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('bill-sheet');
            backdrop.classList.remove('hidden');
            sheet.classList.remove('hidden');
            requestAnimationFrame(() => {
                backdrop.classList.remove('opacity-0');
                sheet.classList.add('sheet-open');
            });
            setTimeout(() => nameInput.focus(), 100);
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('bill-sheet');
            backdrop.classList.add('opacity-0');
            sheet.classList.remove('sheet-open');
            setTimeout(() => { backdrop.classList.add('hidden'); sheet.classList.add('hidden'); }, 300);
        }

        function validateForm() {
            const name = document.getElementById('bill-name').value.trim();
            const date = document.getElementById('bill-date').value;
            document.getElementById('save-btn').disabled = !(name.length > 0 && date);
        }

        async function saveBill() {
            const colRef = getUserBillsCollection();
            const name = document.getElementById('bill-name').value.trim();
            const rawAmount = document.getElementById('bill-amount').value;
            const amount = rawAmount !== '' ? Number(rawAmount) : null;
            const dueDate = document.getElementById('bill-date').value;
            const isRecurring = document.getElementById('bill-recurring').checked;
            if (!colRef || !name || !dueDate) return;

            if (editingId) {
                await colRef.doc(editingId).update({ name, amount, dueDate, isRecurring });
            } else {
                await colRef.add({
                    name,
                    amount,
                    dueDate,
                    isPaid: false,
                    isRecurring,
                    nextGenerated: false
                });
            }
            closeModal();
        }

        async function deleteCurrentBill() {
            const colRef = getUserBillsCollection();
            if (!colRef || !editingId) return;
            await colRef.doc(editingId).delete();
            closeModal();
        }

        function getStartOfDay(dateObj) {
            return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        }

        function parseLocalDate(isoDateStr) {
            const [y, m, d] = isoDateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function getDaysLeft(dueDateStr) {
            const hoje = getStartOfDay(new Date());
            const venc = parseLocalDate(dueDateStr);
            return Math.round((venc - hoje) / (1000 * 60 * 60 * 24));
        }

        function getStatusInfo(bill) {
            if (bill.isPaid) return { text: 'Paga', colorClass: 'text-green-600 dark:text-green-500' };
            const n = getDaysLeft(bill.dueDate);
            let text = n < -1 ? `Venceu há ${-n} dias` : n === -1 ? 'Venceu há 1 dia' : n === 0 ? 'Vence hoje' : n === 1 ? 'Vence amanhã' : `Vence em ${n} dias`;
            let colorClass = n < 0 ? 'text-red-600 dark:text-red-500' : n <= 3 ? 'text-orange-500 dark:text-orange-400' : 'text-gray-500 dark:text-gray-400';
            return { text, colorClass };
        }

        function formatShortDate(dueDateStr) {
            return parseLocalDate(dueDateStr).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '');
        }

        function closeAllSwipes(exceptEl = null) {
            document.querySelectorAll('.swipe-content').forEach(el => {
                if (el !== exceptEl) {
                    el.style.transform = 'translateX(0px)';
                    el.dataset.open = 'false';
                }
            });
        }

        function attachSwipeGesture(container, contentEl) {
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let isSwiping = false;
            const actionWidth = 76;

            contentEl.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isSwiping = false;
                contentEl.classList.add('swipe-dragging');
            }, { passive: true });

            contentEl.addEventListener('touchmove', (e) => {
                const diffX = e.touches[0].clientX - startX;
                const diffY = e.touches[0].clientY - startY;

                if (!isSwiping && Math.abs(diffY) > Math.abs(diffX)) return;
                
                isSwiping = true;
                closeAllSwipes(contentEl);

                const isOpen = contentEl.dataset.open === 'true';
                let translate = isOpen ? -actionWidth + diffX : diffX;

                if (translate > 0) translate = 0;
                if (translate < -actionWidth - 15) translate = -actionWidth - 15;

                currentX = translate;
                contentEl.style.transform = `translateX(${translate}px)`;
            }, { passive: true });

            contentEl.addEventListener('touchend', () => {
                contentEl.classList.remove('swipe-dragging');
                if (!isSwiping) return;

                if (currentX < -38) {
                    contentEl.style.transform = `translateX(-${actionWidth}px)`;
                    contentEl.dataset.open = 'true';
                } else {
                    contentEl.style.transform = 'translateX(0px)';
                    contentEl.dataset.open = 'false';
                }
            });
        }

        function buildBillRow(bill) {
            const status = getStatusInfo(bill);

            const wrapper = document.createElement('div');
            wrapper.className = 'relative overflow-hidden bg-red-500';

            const trashBtn = document.createElement('button');
            trashBtn.type = 'button';
            trashBtn.className = 'absolute inset-y-0 right-0 w-[76px] bg-red-500 active:bg-red-600 text-white flex items-center justify-center';
            trashBtn.setAttribute('aria-label', 'Excluir');
            trashBtn.onclick = () => deleteBillById(bill.id);
            trashBtn.innerHTML = `
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            `;

            const recurringBadge = bill.isRecurring
                ? `<span class="inline-flex items-center gap-0.5 text-[11px] font-medium px-1.5 py-0.5 rounded bg-blue-500/10 text-[#007AFF]">↻ Mensal</span>`
                : '';

            const amountText = bill.amount != null && Number(bill.amount) > 0
                ? `<span class="text-gray-600 dark:text-gray-300 font-semibold">• ${formatBRL(bill.amount)}</span>`
                : '';

            const contentEl = document.createElement('div');
            contentEl.className = 'swipe-content relative bg-white dark:bg-[#1C1C1E] flex items-center justify-between px-4 py-3.5 gap-2 z-10';
            contentEl.dataset.open = 'false';
            contentEl.innerHTML = `
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                        <span class="font-semibold text-[17px] truncate ${bill.isPaid ? 'line-through text-gray-400 dark:text-gray-500' : ''}">
                            ${escapeHTML(bill.name)}
                        </span>
                        ${recurringBadge}
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5 text-[13px] mt-0.5">
                        <span class="font-bold ${status.colorClass}">${status.text}</span>
                        <span class="text-gray-400 dark:text-gray-500">• ${formatShortDate(bill.dueDate)}</span>
                        ${amountText}
                    </div>
                </div>
                <button type="button" onclick="exportBillToCalendar('${bill.id}')" aria-label="Adicionar ao calendário" class="p-2 text-gray-400 hover:text-gray-300 active:opacity-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </button>
                <button type="button" onclick="openModal('${bill.id}')" aria-label="Editar" class="p-2 text-gray-400 hover:text-gray-300 active:opacity-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                    </svg>
                </button>
                <button type="button" onclick="togglePaid('${bill.id}')" 
                    class="text-[14px] font-bold min-w-[88px] py-1.5 px-3 rounded-full border-2 transition-colors active:scale-95
                    ${bill.isPaid ? 'bg-green-600 border-green-600 text-white' : 'border-black dark:border-white text-black dark:text-white'}">
                    ${bill.isPaid ? '✓ Paga' : 'Não paga'}
                </button>
            `;

            wrapper.appendChild(trashBtn);
            wrapper.appendChild(contentEl);
            attachSwipeGesture(wrapper, contentEl);
            return wrapper;
        }

        function render() {
            const groupedEl = document.getElementById('grouped-bills');
            const emptyEl = document.getElementById('empty-state');
            const emptyTextEl = document.getElementById('empty-text');
            const bannerEl = document.getElementById('alert-banner');
            const bannerTextEl = document.getElementById('alert-text');
            const totalsCard = document.getElementById('totals-card');

            const currentMonthKey = getOffsetMonthKey(0);
            const prevMonth1Key = getOffsetMonthKey(-1);
            const prevMonth2Key = getOffsetMonthKey(-2);
            const historyMonthKeys = [prevMonth1Key, prevMonth2Key];

            const byDueDate = (a, b) => parseLocalDate(a.dueDate) - parseLocalDate(b.dueDate);

            // Na virada do mês: contas do mês atual OU recorrentes não pagas de meses anteriores
            const currentBills = bills.filter(b => {
                if (!b.dueDate) return false;
                const mKey = getMonthKeyFromDateStr(b.dueDate);
                if (mKey === currentMonthKey) return true;
                if (mKey < currentMonthKey && b.isRecurring && !b.isPaid) return true;
                return false;
            });

            // Histórico limitado estritamente aos 2 meses anteriores
            const historyBills = bills.filter(b => {
                if (!b.dueDate) return false;
                const mKey = getMonthKeyFromDateStr(b.dueDate);
                return historyMonthKeys.includes(mKey);
            });

            const activeSet = currentPage === 'current' ? currentBills : historyBills;

            const hasAnyAmount = activeSet.some(b => b.amount != null && Number(b.amount) > 0);
            if (hasAnyAmount) {
                const openItems = activeSet.filter(b => !b.isPaid);
                const paidItems = activeSet.filter(b => b.isPaid);
                const sumOpen = openItems.reduce((acc, b) => acc + (Number(b.amount) || 0), 0);
                const sumPaid = paidItems.reduce((acc, b) => acc + (Number(b.amount) || 0), 0);
                document.getElementById('total-open').textContent = formatBRL(sumOpen);
                document.getElementById('total-paid').textContent = formatBRL(sumPaid);
                totalsCard.classList.remove('hidden');
            } else {
                totalsCard.classList.add('hidden');
            }

            bannerEl.className = 'hidden rounded-xl p-3.5 flex items-center gap-3 font-semibold text-sm shadow-sm';
            groupedEl.innerHTML = '';

            if (currentPage === 'current') {
                const open = currentBills.filter(b => !b.isPaid).sort(byDueDate);
                const paid = currentBills.filter(b => b.isPaid).sort(byDueDate);

                const late = open.filter(b => getDaysLeft(b.dueDate) < 0);
                const soon = open.filter(b => {
                    const d = getDaysLeft(b.dueDate);
                    return d >= 0 && d <= 3;
                });
                const upcoming = open.filter(b => getDaysLeft(b.dueDate) > 3);

                if (late.length > 0) {
                    bannerEl.classList.remove('hidden');
                    bannerEl.classList.add('bg-red-500/15', 'text-red-600', 'dark:text-red-400');
                    bannerTextEl.textContent = late.length === 1 ? `1 conta atrasada: ${late[0].name}` : `${late.length} contas atrasadas`;
                } else if (soon.length > 0) {
                    bannerEl.classList.remove('hidden');
                    bannerEl.classList.add('bg-orange-500/15', 'text-orange-600', 'dark:text-orange-400');
                    bannerTextEl.textContent = soon.length === 1 ? `1 conta vence em breve: ${soon[0].name}` : `${soon.length} contas vencem em breve`;
                }

                if (currentBills.length === 0) {
                    groupedEl.classList.add('hidden');
                    emptyTextEl.innerHTML = 'Nenhuma conta neste mês.<br>Toque em <strong>+</strong> para começar.';
                    emptyEl.classList.remove('hidden');
                    return;
                }

                emptyEl.classList.add('hidden');
                groupedEl.classList.remove('hidden');

                const groups = [
                    { title: 'Atrasadas', items: late, titleClass: 'text-red-600 dark:text-red-400' },
                    { title: 'Vencem em breve', items: soon, titleClass: 'text-orange-600 dark:text-orange-400' },
                    { title: 'Próximas', items: upcoming, titleClass: 'text-gray-500 dark:text-gray-400' },
                    { title: 'Pagas', items: paid, titleClass: 'text-green-600 dark:text-green-500' }
                ];

                groups.forEach(group => {
                    if (group.items.length === 0) return;

                    const section = document.createElement('section');
                    section.className = 'space-y-1.5';

                    const heading = document.createElement('h2');
                    heading.className = `px-1 text-xs font-bold uppercase tracking-wider ${group.titleClass}`;
                    heading.textContent = `${group.title} (${group.items.length})`;

                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm';

                    group.items.forEach(bill => {
                        card.appendChild(buildBillRow(bill));
                    });

                    section.appendChild(heading);
                    section.appendChild(card);
                    groupedEl.appendChild(section);
                });
            } else {
                // Página de Histórico (somente os 2 meses anteriores)
                if (historyBills.length === 0) {
                    groupedEl.classList.add('hidden');
                    emptyTextEl.innerHTML = 'Nenhuma conta no histórico dos últimos 2 meses.';
                    emptyEl.classList.remove('hidden');
                    return;
                }

                emptyEl.classList.add('hidden');
                groupedEl.classList.remove('hidden');

                historyMonthKeys.forEach(mKey => {
                    const monthItems = historyBills
                        .filter(b => getMonthKeyFromDateStr(b.dueDate) === mKey)
                        .sort(byDueDate);

                    if (monthItems.length === 0) return;

                    const section = document.createElement('section');
                    section.className = 'space-y-1.5';

                    const heading = document.createElement('h2');
                    heading.className = 'px-1 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400';
                    heading.textContent = `${formatMonthLabel(mKey)} (${monthItems.length})`;

                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-[#1C1C1E] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm';

                    monthItems.forEach(bill => {
                        card.appendChild(buildBillRow(bill));
                    });

                    section.appendChild(heading);
                    section.appendChild(card);
                    groupedEl.appendChild(section);
                });
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
